<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索 · Minis</title>
<style>
  :root { --bg: #1a1a2e; --card: #16213e; --hover: #1f3a5f; --accent: #c2453c; --text: #e0e0e0; --muted: #888; --border: #30363d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { padding: 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 24px; color: var(--accent); }
  nav { display: flex; gap: 8px; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  nav a { padding: 8px 16px; background: var(--card); border-radius: 8px; color: var(--text); text-decoration: none; font-size: 14px; }
  nav a:hover, nav a.active { background: var(--accent); }
  main { padding: 20px; max-width: 900px; margin: 0 auto; }
  .search-box { position: relative; margin-bottom: 20px; }
  .search-box input { width: 100%; padding: 14px 50px 14px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 16px; }
  .search-box input:focus { outline: none; border-color: var(--accent); }
  .search-box button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: 6px 12px; background: var(--accent); border: none; border-radius: 6px; color: white; cursor: pointer; }
  .results { margin-top: 20px; }
  .result-item { background: var(--card); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .result-item h3 { font-size: 15px; margin-bottom: 6px; }
  .result-item .path { font-size: 12px; color: var(--muted); }
  .result-item .score { font-size: 11px; color: var(--accent); float: right; }
  .result-item .snippet { font-size: 13px; color: var(--text); margin-top: 8px; line-height: 1.5; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .tags { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .tag { padding: 2px 8px; background: var(--border); border-radius: 4px; font-size: 11px; color: var(--muted); }
  .folder-select { margin-bottom: 16px; }
  .folder-select select { padding: 8px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
  footer { padding: 20px; text-align: center; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); margin-top: 40px; }
</style>
</head>
<body>
<header><h1>🔍 Obsidian 搜索</h1></header>
<nav>
  <a href="/index.html">🏠 首页</a>
  <a href="/search.html" class="active">🔍 搜索</a>
  <a href="/dashboard.html">📊 仪表盘</a>
  <a href="/daily-logs.html">📝 日报</a>
  <a href="/gzh-team.html">📰 公众号</a>
  <a href="/knowledge-graph.html">📊 知识图谱</a>
</nav>
<main>
  <div class="folder-select">
    <select id="folder-filter">
      <option value="">所有文件夹</option>
      <option value="00-Inbox">00-Inbox</option>
      <option value="01-Projects">01-Projects</option>
      <option value="02-Areas">02-Areas</option>
      <option value="03-Resources">03-Resources</option>
      <option value="04-Archives">04-Archives</option>
    </select>
  </div>
  <div class="search-box">
    <input type="text" id="search-input" placeholder="搜索笔记... (如: 'AI工具评测')" autocomplete="off">
    <button onclick="doSearch()">搜索</button>
  </div>
  <div class="results" id="results"><div class="loading">输入关键词开始搜索</div></div>
</main>
<footer>Minis Web Portal · 2026-09-25</footer>
<script>
document.getElementById('search-input').addEventListener('keypress', e => { if (e.key === 'Enter') doSearch(); });

async function doSearch() {
  const query = document.getElementById('search-input').value.trim();
  const folder = document.getElementById('folder-filter').value;
  if (!query) return;
  
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '<div class="loading">搜索中...</div>';
  
  try {
    const params = new URLSearchParams({ q: query, top: 15 });
    if (folder) params.set('folder', folder);
    
    const res = await fetch(`/api/search?${params}`);
    const data = await res.json();
    
    if (data.results && data.results.length > 0) {
      resultsDiv.innerHTML = `<div style="margin-bottom: 12px; color: var(--muted); font-size: 13px;">找到 ${data.results.length} 条结果</div>` +
        data.results.map(r => `
          <div class="result-item">
            <span class="score">分数: ${r.score.toFixed(2)}</span>
            <h3>${r.title}</h3>
            <div class="path">${r.path.replace('/var/minis/mounts/loong/', '')}</div>
            <div class="snippet">${r.snippet || r.body?.substring(0, 150) || ''}...</div>
            <div class="tags">
              ${(r.tags || []).slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
          </div>
        `).join('');
    } else {
      resultsDiv.innerHTML = '<div class="loading">未找到相关结果</div>';
    }
  } catch(e) {
    resultsDiv.innerHTML = `<div class="loading">搜索失败: ${e.message}</div>`;
  }
}
</script>
</body>
</html>
