## 第一卷核心事件链

### 触发事件（Ch001-003）
**事件**：整理旧物时发现与鉴灵匣共鸣的残破阵盘

**具体情节**：
- Ch001《第三处节点》：林辰夜巡丹房，发现第七号炉火候异常，凭直觉调整成功，引起张明德注意
- Ch002《铜匣微温》：回房后铜匣发热，纹路亮了一瞬；次日在藏经阁废墟整理旧物，发现半块残破阵盘，触碰时匣身震颤
- Ch003《暗流》：阵盘上有残缺阵纹，与丹房故障特征吻合；陆鸣出现，试探性询问

**关键伏笔**：
- 阵盘来源：来自三十年前一桩未解的丹房事故
- 陆鸣身份：表面是核心弟子，实为藏锋堂暗线

---

### 发展阶段（Ch004-015）
**事件**：暗中修复阵盘，逐步展现辅助能力

**阶段目标**：
- 验证鉴灵匣功能（控火诀已解锁）
- 建立"低调但可靠"的人设
- 积累初步人脉（张明德、苏婉）

**关键情节**：
- Ch004-006：林辰利用控火诀暗中辅助丹房，多次"巧合"化解危机
- Ch007《试探》：孙鹤起疑，安排监视；林辰察觉但选择无视
- Ch008-010：苏婉主动接触，发现林辰的"异常"，选择保密
- Ch011-013：阵盘修复进度70%，发现完整阵法可提升丹药成丹率30%
- Ch014-015：陆鸣再次出现，递出"邀请"——加入某个秘密项目

**爽点分布**：
- L1：Ch004（首次成功）、Ch007（反监视）、Ch011（修复突破）
- L2：Ch013（阵法验证成功）、Ch015（获得邀请）

---

### 冲突升级（Ch016-022）
**事件**：藏锋堂试探 vs 天机阁内部博弈

**核心冲突**：
- 藏锋堂想拉拢林辰，测试其价值
- 丹鼎殿赵孟恒察觉异常，准备调查
- 林辰必须在"暴露"和"沉默"间找平衡

**关键情节**：
- Ch016-018：陆鸣安排"考验"——修复一件破损法器，限时三日
- Ch019《抉择》：林辰借助鉴灵匣完成，但刻意隐藏部分能力
- Ch020-021：赵孟恒派人查丹房记录，发现异常；孙鹤被施压
- Ch022：林辰主动找孙鹤，表明"愿意帮忙，但要求保密"

**爽点分布**：
- L2：Ch019（考验通过）
- L3：Ch022（主动谈判，反客为主）

---

### 高潮节点（Ch023-027）
**事件**：丹房重大事故 vs 林辰出手

**核心事件**：
- 一批重要丹药即将炸炉
- 赵孟恒束手无策
- 林辰必须选择：出手或旁观

**关键情节**：
- Ch023-025：事故前兆，众人忙碌；林辰冷静观察，确认是第三处节点故障
- Ch026《出手》：林辰以"偶然路过"为由介入，用控火诀稳住局面
- Ch027：事故化解，但有人注意到他的手法——极其专业，不像杂役

**爽点分布**：
- L3：Ch026（高潮出手）
- L4：Ch027（余波，阁主得知）

---

### 收尾与钩子（Ch028-030）
**事件**： aftermath + 新悬念

**关键情节**：
- Ch028：赵孟恒态度转变，从怀疑转为拉拢
- Ch029：苏婉提醒林辰——藏锋堂已经注意到他
- Ch030《暗观》：天机阁顶层，玄机子看着报告，轻语："有趣。"

**卷末钩子**：
- 阁主启动秘密调查
- 藏锋堂正式发出邀请
- 鉴灵匣第二层刻纹显现（新危机）

---

## 人物弧光

### 林辰
- **起点**：被动接受命运，只求自保
- **终点**：主动选择站队，决定利用辅助之道破局
- **关键转折**：Ch026出手 → Ch030接受邀请

### 苏婉
- **定位**：盟友雏形
- **作用**：信息渠道 + 情感锚点
- **本章变化**：从怀疑 → 信任 → 主动协助

### 陆鸣
- **定位**：灰色人物
- **作用**：藏锋堂探针 + 后续伏笔
- **本章变化**：试探 → 兴趣 → 正式拉拢

### 赵孟恒
- **定位**：利益驱动者
- **作用**：压力来源 + 潜在合作者
- **本章变化**：怀疑 → 利用 → 合作

