## Q05：第一卷具体任务

**追问目标**：把"站稳脚跟"变成可执行的具体目标

**starter_question**：
> 第一卷30章，林辰要在丹房完成什么具体任务？

**follow_up 模式**：
1. 这个任务的目标是什么？谁定的？
2. 任务的考核标准是什么？
3. 任务失败会怎样？成功会怎样？
4. 任务过程中会遇到什么阻碍？
5. 任务完成后，主角获得什么？失去什么？

**期望输出格式**：
```markdown
### 第一卷任务
- **任务定义**：
  - 目标：{具体可执行的目标}
  - 发起者：{谁给的任务}
  - 截止时间：{第几章前完成}
- **成功条件**：{怎样算完成}
- **失败后果**：{失败会怎样}
- **任务阻碍**：
  | 阻碍 | 类型 | 强度 | 出现章节 |
- **任务收益**：
  - 短期：{完成后的即时收益}
  - 长期：{对主线的影响}
  - 代价：{完成任务的代价}
```

