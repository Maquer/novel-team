## Q04：主角的特殊性

**追问目标**：明确为什么是林辰，而不是别人

**starter_question**：
> 鉴灵匣为什么认林辰为主？是巧合还是必然？

**follow_up 模式**：
1. 林辰的血脉/身世有什么特殊之处？
2. 为什么他恰好是杂役身份？
3. 他的性格特质如何与辅助之道匹配？
4. 如果他一开始不是杂役，故事会变成什么样？
5. 他的金手指有什么局限/代价？

**期望输出格式**：
```markdown
### 主角特殊性
- **血脉秘密**：{为什么是林辰}
- **身份必然性**：{为什么是杂役，不是弟子}
- **性格匹配**：{特质如何与辅助之道契合}
- **金手指局限**：{有什么限制/代价}
- **身份反转可能**：{如果暴露会怎样}
```

