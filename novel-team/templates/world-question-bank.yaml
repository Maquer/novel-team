## 追问纪律

### ✅ 正确做法
- 每次只问一个问题，等回答后再问下一个
- 每个回答后追问"为什么"，直到触及根源
- 记录所有回答，不假设、不补充
- 用户说"你决定"时停止追问，用已有信息推断

### ❌ 禁止做法
- 一次问多个问题
- 替用户做决定
- 假设用户知道什么
- 跳过某个领域直接问下一个

### 决策树格式
```markdown
## Q01：力量体系的代价
- **Q**: {问题}
- **A**: {用户回答}
- **Status**: ✅ RESOLVED / ❓ UNRESOLVED
- **Follow-up**:
  - Q: {下一个问题}
  - A: {用户回答}
  - ...
```
