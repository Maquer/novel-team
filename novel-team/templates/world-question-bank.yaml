# 世界包追问问题库 v1.0

> 设计日期：2026-09-30
> 用途：Phase 1 grill-me 追问的标准问题库
> 来源：world-building-flow-v3.md Phase 1 定义

---

## Q01：力量体系的代价

**追问目标**：明确境界晋升的具体代价和社会影响

**starter_question**：
> 锻体九重和聚气初，差距体现在哪些具体方面？谁是这个差距的受益者/受害者？

**follow_up 模式**（每答完一个继续问）：
1. 这个差距为什么存在？是谁定的？
2. 违反这个规矩的后果是什么？
3. 有没有人想改变它？为什么没改成？
4. 主角的处境在这个体系里处于什么位置？
5. 如果主角要突破，他需要付出什么代价？

**期望输出格式**：
```markdown
### 力量体系代价
- **差距来源**：{谁定的规矩}
- **晋升代价**：{主角需要付什么}
- **违规后果**：{违反规矩会怎样}
- **收益归属**：{谁从差距中获益}
- **反抗空间**：{有没有人想改变？为什么没改成？}
```

---

## Q02：社会结构的根源

**追问目标**：明确阶层流动的限制条件

**starter_question**：
> 林辰是杂役，杂役在这个世界里为什么只能待在丹房？

**follow_up 模式**：
1. 这个限制是他自己选的，还是制度强加的？
2. 制度的来源是什么（谁定的/为什么定）？
3. 有没有绕过这个限制的途径？
4. 如果主角要改变处境，他需要突破什么？
5. 如果他成功了，会动摇谁的利益？

**期望输出格式**：
```markdown
### 社会结构
- **阶层划分依据**：{境界/血脉/贡献点/其他}
- **流动通道**：
  | 通道 | 条件 | 成功率 | 限制 |
- **主角当前位置**：{起点}
- **可突破路径**：{有哪些路？}
- **主要障碍**：{什么阻止他上升？}
- **成功后的代价**：{会触动谁？}
```

---

## Q03：核心矛盾的发动机

**追问目标**：明确故事的冲突根源

**starter_question**：
> 天机阁为什么选择中立？中立对主角意味着什么？

**follow_up 模式**：
1. 魔道觊觎鉴灵匣的真正原因是什么？
2. 阁主玄机子百年坐镇，他在等什么？
3. 如果主角的金手指暴露，谁会受益/受损？
4. 主线矛盾的终点是什么？
5. 主角的立场会如何变化？

**期望输出格式**：
```markdown
### 核心矛盾
- **矛盾根源**：{一句话概括}
- **各方立场**：
  | 势力 | 立场 | 核心诉求 | 与主角关系 |
- **主角处境**：{在矛盾中的位置}
- **矛盾终点**：{故事结束时会怎样}
- **不可调和点**：{什么情况下必须开战？}
```

