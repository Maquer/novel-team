<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>公众号封面 1800x766</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1800px; height: 766px; overflow: hidden; font-family: "PingFang SC", "PingFangSC-Light", "Helvetica Neue", sans-serif; }
  .cover {
    position: relative; width: 1800px; height: 766px;
    background: radial-gradient(1200px 600px at 30% 20%, #16245e 0%, #0d1440 45%, #070b28 100%);
    overflow: hidden;
  }
  /* 微光晕 */
  .glow {
    position: absolute; border-radius: 50%; filter: blur(60px); opacity: .35;
  }
  .glow-cyan { width: 500px; height: 500px; background: #22d3ee; top: -120px; right: -80px; }
  .glow-amber { width: 420px; height: 420px; background: #f59e0b; bottom: -140px; left: 30%; }

  /* 顶部散落小方块 (100+ 个的隐喻) */
  .dust {
    position: absolute; background: rgba(148,163,184,.5); border-radius: 3px;
    opacity: .6;
  }

  /* 漏斗 */
  .funnel {
    position: absolute; left: 50%; top: 92px; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 210px solid transparent;
    border-right: 210px solid transparent;
    border-top: 150px solid rgba(34,211,238,.16);
    border-bottom: none;
    filter: drop-shadow(0 0 18px rgba(34,211,238,.25));
  }
  .funnel-line {
    position: absolute; left: 50%; top: 92px; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 214px solid transparent;
    border-right: 214px solid transparent;
    border-top: 154px solid rgba(34,211,238,.5);
    border-bottom: none;
    clip-path: inset(0 0 0 0);
    -webkit-mask: linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,0) 92%);
    mask: linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,0) 92%);
  }
  .funnel-neck {
    position: absolute; left: 50%; top: 242px; transform: translateX(-50%);
    width: 26px; height: 90px; background: linear-gradient(180deg, rgba(34,211,238,.35), rgba(34,211,238,.1)); border-radius: 0 0 8px 8px;
  }

  /* 6 个精选金块 */
  .stones { position: absolute; left: 50%; transform: translateX(-50%); top: 356px; display: flex; gap: 22px; }
  .stone {
    width: 78px; height: 78px; border-radius: 14px;
    background: linear-gradient(145deg, #fbbf24 0%, #f59e0b 55%, #b45309 100%);
    box-shadow: 0 8px 28px rgba(245,158,11,.55), inset 0 2px 2px rgba(255,255,255,.5);
    position: relative;
  }
  .stone::after {
    content: ''; position: absolute; inset: 0; border-radius: 14px;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.5), transparent 55%);
  }
  /* 底部地面阴影 */
  .ground-shadow {
    position: absolute; left: 50%; transform: translateX(-50%); top: 470px;
    width: 700px; height: 40px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(34,211,238,.18), transparent 70%);
  }

  /* 标题区 */
  .titles { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; }
  .t1 {
    font-size: 58px; font-weight: 700; color: #f8fafc; letter-spacing: 2px;
    text-shadow: 0 4px 24px rgba(0,0,0,.6);
  }
  .t1 .accent { color: #fbbf24; }
  .t2 {
    margin-top: 14px; font-size: 30px; font-weight: 400; color: rgba(203,213,225,.75);
    letter-spacing: 6px;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="glow glow-cyan"></div>
  <div class="glow glow-amber"></div>

  <!-- 散落方块 (模拟 100+) -->
  <div class="dust" style="width:34px;height:34px;top:60px;left:240px;"></div>
  <div class="dust" style="width:22px;height:22px;top:120px;left:160px;"></div>
  <div class="dust" style="width:40px;height:40px;top:40px;left:420px;"></div>
  <div class="dust" style="width:26px;height:26px;top:150px;left:340px;"></div>
  <div class="dust" style="width:18px;height:18px;top:80px;left:560px;"></div>
  <div class="dust" style="width:30px;height:30px;top:180px;left:520px;"></div>
  <div class="dust" style="width:24px;height:24px;top:50px;left:700px;"></div>
  <div class="dust" style="width:36px;height:36px;top:140px;left:660px;"></div>
  <div class="dust" style="width:20px;height:20px;top:220px;left:620px;"></div>
  <div class="dust" style="width:14px;height:14px;top:60px;left:880px;"></div>
  <div class="dust" style="width:28px;height:28px;top:170px;left:860px;"></div>
  <div class="dust" style="width:30px;height:30px;top:70px;left:1020px;"></div>
  <div class="dust" style="width:19px;height:19px;top:150px;left:1100px;"></div>
  <div class="dust" style="width:24px;height:24px;top:50px;left:1220px;"></div>
  <div class="dust" style="width:32px;height:32px;top:170px;left:1180px;"></div>
  <div class="dust" style="width:17px;height:17px;top:90px;left:1330px;"></div>
  <div class="dust" style="width:26px;height:26px;top:200px;left:1300px;"></div>
  <div class="dust" style="width:38px;height:38px;top:70px;left:1470px;"></div>
  <div class="dust" style="width:22px;height:22px;top:160px;left:1540px;"></div>
  <div class="dust" style="width:15px;height:15px;top:40px;left:1610px;"></div>

  <div class="funnel-line"></div>
  <div class="funnel"></div>
  <div class="funnel-neck"></div>

  <div class="ground-shadow"></div>
  <div class="stones">
    <div class="stone"></div><div class="stone"></div><div class="stone"></div>
    <div class="stone"></div><div class="stone"></div><div class="stone"></div>
  </div>

  <div class="titles">
    <div class="t1">我筛掉了 <span class="accent">100+</span> 个 AI 工具</div>
    <div class="t2">只剩 <span style="color:#fbbf24;font-weight:600;">6</span> 个天天用</div>
  </div>
</div>
</body>
</html>
