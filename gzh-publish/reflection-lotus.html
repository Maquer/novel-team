<!DOCTYPE html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/></head><body style="margin:0;padding:20px 16px;background:#fff;"><section style="max-width:677px;margin:0 auto;"><section style="margin:0 0 26px 0;padding:16px 18px;background:#F7F5F0;border-left:4px solid #8A7B5C;border-radius:0 2px 2px 0;"><p style="margin:0;font-size:15.5px;line-height:1.9;letter-spacing:.5px;color:#5E5340;font-family:'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;text-align:justify;">有人穷得毫无底线，有人穷得始终有尊严。</p></section>
<section style="margin:0 0 26px 0;padding:16px 18px;background:#F7F5F0;border-left:4px solid #8A7B5C;border-radius:0 2px 2px 0;"><p style="margin:0;font-size:15.5px;line-height:1.9;letter-spacing:.5px;color:#5E5340;font-family:'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;text-align:justify;">这样的穷，或许终会像那扎根淤泥中的莲子——在时间的催化下，孕育出可以绽放的洁白，不沾染一丝泥土气息。</p></section>
<p style="margin:0 0 22px 0;font-size:15px;line-height:1.9;letter-spacing:.5px;color:#4A4A48;font-family:'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;text-align:justify;">而这样的美，才是真的美。</p>
<p style="margin:0 0 22px 0;font-size:15px;line-height:1.9;letter-spacing:.5px;color:#4A4A48;font-family:'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;text-align:justify;">当一个人被命运摆弄得越久，而始终没有放弃自己，命运终将化作一条船，将她摆渡到与起初截然相反的彼岸。</p>
<p style="margin:0 0 22px 0;font-size:15px;line-height:1.9;letter-spacing:.5px;color:#4A4A48;font-family:'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;text-align:justify;">遇见不易，相处太难，能走到一起，确实很不容易。</p>
<p style="margin:0 0 22px 0;font-size:15px;line-height:1.9;letter-spacing:.5px;color:#4A4A48;font-family:'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;text-align:justify;">愿所有的淤泥，都开出莲。</p></section></body></html>
