<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人博客</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="/" class="logo">个人博客</a>
      <nav class="nav">
        <a href="/" class="active">首页</a>
        <a href="/articles.html">文章</a>
        <a href="/about.html">关于</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- Hero -->
    <section class="hero">
      <div class="container">
        <h1>探索思考，记录成长</h1>
        <p>一个关于技术、AI 和个人成长的博客</p>
        <a href="/articles.html" class="btn">浏览文章</a>
      </div>
    </section>

    <!-- Featured -->
    <section class="featured">
      <div class="container">
        <h2 class="section-title">精选文章</h2>
        <div class="article-grid" id="featured-articles"></div>
      </div>
    </section>

    <!-- Recent + Sidebar -->
    <section class="recent-section">
      <div class="container">
        <div class="sidebar-layout">
          <div class="main-content">
            <h2 class="section-title">最新文章</h2>
            <div class="article-list" id="recent-articles"></div>
          </div>
          <aside class="sidebar">
            <div class="widget">
              <h3>分类</h3>
              <ul class="category-list" id="categories"></ul>
            </div>
            <div class="widget">
              <h3>关于我</h3>
              <p>全栈工程师，热爱开源和技术分享。</p>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 个人博客. 使用 React + Node.js 构建.</p>
    </div>
  </footer>
</body>
</html>
